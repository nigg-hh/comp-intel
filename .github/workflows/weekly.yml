name: weekly-comp-intel

on:
  schedule:
    - cron: "0 23 * * 0"   # 毎週月曜 08:00 JST
  workflow_dispatch: {}     # 手動実行も可能

permissions:
  contents: write
  issues: write
  models: read              # GitHub Models API(無料枠)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect snapshots
        run: python src/collector.py

      - name: Diff
        run: python src/differ.py

      - name: Analyze (GitHub Models)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/analyzer.py

      - name: Report
        run: python src/reporter.py

      - name: Commit snapshots & reports
        run: |
          git config user.name "comp-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshots reports
          git diff --cached --quiet || git commit -m "weekly snapshot $(date +%F)"
          git push

      - name: Create issue for human review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "週次競合レポート $(date +%F)" \
            --body-file reports/report_latest.md \
            --label "weekly-report"
